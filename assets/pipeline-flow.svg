<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 170" width="940" height="170" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Risk Alert Classifier workflow</title>
  <desc id="d">Animated flow: Data, Prepare, Split, Train, Evaluate, Deploy.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; text-anchor: middle; }
    .bg    { fill: #0d1117; }
    .title { fill: #e6edf3; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    .node  { fill: #161b22; stroke: url(#g); stroke-width: 2; animation: pulse 6s ease-in-out infinite; }
    .name  { fill: #e6edf3; font-size: 15px; font-weight: 700; }
    .sub   { fill: #8b949e; font-size: 12px; }
    .step  { fill: #2dd4bf; font-size: 11px; font-weight: 600; }
    .link  { stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; }
    .n4 { animation-delay: 3s; } .n5 { animation-delay: 4s; } .n6 { animation-delay: 5s; }
    @keyframes flow  { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0% { fill: #161b22; } 6% { fill: #1b4b7a; } 18% { fill: #161b22; } 100% { fill: #161b22; } }
  </style>

  <rect class="bg" width="940" height="170" rx="14"/>
  <text class="title" x="470" y="34">RISK ALERT CLASSIFIER  ·  END-TO-END WORKFLOW</text>

  <!-- connectors -->
  <line class="link" x1="150" y1="105" x2="188" y2="105" marker-end="url(#arrow)"/>
  <line class="link" x1="300" y1="105" x2="338" y2="105" marker-end="url(#arrow)"/>
  <line class="link" x1="450" y1="105" x2="488" y2="105" marker-end="url(#arrow)"/>
  <line class="link" x1="600" y1="105" x2="638" y2="105" marker-end="url(#arrow)"/>
  <line class="link" x1="750" y1="105" x2="788" y2="105" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <rect class="node n1" x="40"  y="65" width="110" height="80" rx="12"/>
  <rect class="node n2" x="190" y="65" width="110" height="80" rx="12"/>
  <rect class="node n3" x="340" y="65" width="110" height="80" rx="12"/>
  <rect class="node n4" x="490" y="65" width="110" height="80" rx="12"/>
  <rect class="node n5" x="640" y="65" width="110" height="80" rx="12"/>
  <rect class="node n6" x="790" y="65" width="110" height="80" rx="12"/>

  <text class="step" x="95"  y="86">STEP 1</text>
  <text class="step" x="245" y="86">STEP 2</text>
  <text class="step" x="395" y="86">STEP 3</text>
  <text class="step" x="545" y="86">STEP 4</text>
  <text class="step" x="695" y="86">STEP 5</text>
  <text class="step" x="845" y="86">STEP 6</text>

  <text class="name" x="95"  y="108">Data</text>
  <text class="name" x="245" y="108">Prepare</text>
  <text class="name" x="395" y="108">Split</text>
  <text class="name" x="545" y="108">Train</text>
  <text class="name" x="695" y="108">Evaluate</text>
  <text class="name" x="845" y="108">Deploy</text>

  <text class="sub" x="95"  y="128">4,600 × 19</text>
  <text class="sub" x="245" y="128">14 features</text>
  <text class="sub" x="395" y="128">80 / 20</text>
  <text class="sub" x="545" y="128">Random Forest</text>
  <text class="sub" x="695" y="128">Metrics + plots</text>
  <text class="sub" x="845" y="128">Streamlit app</text>
</svg>
